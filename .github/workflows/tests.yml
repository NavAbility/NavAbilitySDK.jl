name: Unit tests

on: 
  push:
    branches:
      - main
      - release**
    tags:
      - v**
  pull_request:
  workflow_dispatch:
    inputs:
      auth_token:
        description: 'NavAbility API auth token'
        required: true
        type: string
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: 
          - 'lts'
          - '1'
        # - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - id: set_auth_token #TODO get auth token automatically here #49
        name: Set auth token
        run: |
          if [ -z "${{ inputs.auth_token }}" ]; then
            echo "FIXME not implemented - Fetching auth token from AWS Cognito..."
            auth_token=""
          else
            auth_token=${{ inputs.auth_token }}
          fi
          echo "::add-mask::$auth_token"
          echo "nva_auth_token=$auth_token" >> "$GITHUB_OUTPUT"
      - uses: julia-actions/julia-runtest@v1
        env:
          AUTH_TOKEN: ${{ steps.set_auth_token.outputs.nva_auth_token }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - run: |
          julia --project=docs -e '
            using Documenter: DocMeta, doctest
            using NavAbilitySDK
            DocMeta.setdocmeta!(NavAbilitySDK, :DocTestSetup, :(using NavAbilitySDK); recursive=true)
            doctest(NavAbilitySDK)'
